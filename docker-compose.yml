services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coexistencia}
      POSTGRES_USER: ${POSTGRES_USER:-coexistencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coexistencia]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-coexistencia}
      PGUSER: ${POSTGRES_USER:-coexistencia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_URL: ${APP_URL}
      FB_APP_ID: ${FB_APP_ID}
      FB_APP_SECRET: ${FB_APP_SECRET}
      FB_CONFIG_ID: ${FB_CONFIG_ID}
      FB_GRAPH_API_VERSION: ${FB_GRAPH_API_VERSION:-v22.0}
      FB_VERIFY_TOKEN: ${FB_VERIFY_TOKEN}
      FB_REG_PIN: ${FB_REG_PIN}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
